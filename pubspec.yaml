name: task_flow_app
description: "تطبيق إدارة المهام والإنتاجية - Task Flow"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  go_router: ^14.2.0
  fl_chart: ^0.68.0
  intl: ^0.20.2
  table_calendar: ^3.1.2
  percent_indicator: ^4.2.3
  google_fonts: 6.2.1
  flutter_svg: ^2.0.10+1
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.2
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.16.0
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# إعداد أيقونة التطبيق: بعد flutter pub get شغّل
#   dart run flutter_launcher_icons
# لتوليد أيقونات كل المنصات من الصورة أدناه (استبدلها بشعارك الخاص قبل النشر)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
